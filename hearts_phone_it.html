			<script type="module">
			import Swiper from 'https://unpkg.com/swiper@8/swiper-bundle.esm.browser.min.js';
			import scene from "./js/hearts_phone.js";

			const quadri = [
				'01.jpg','02.jpg','03.jpg','04.jpg','05.jpg','06.jpg','07.jpg','08.jpg',
				'09.jpg','10.jpg','11.jpg','12.jpg','13.jpg','14.jpg','15.jpg','16.jpg',
				'17.jpg','18.jpg','19.jpg','20.jpg'
			];

			/* EMOZIONI VERSIONE ITA CHILD-FRIENDLY */
			const emozioni = [
				{ color: "#DEC414", label: "ALLEGRO" },
				{ color: "#FEF600", label: "CURIOSO" },
				{ color: "#FFD700", label: "SORPRENDENTE" },
				{ color: "#C9A021", label: "DIVERTITO" },
				{ color: "#FE005B", label: "TRANQUILLO" },
				{ color: "#FF0000", label: "ENERGICO" },
				{ color: "#A32590", label: "SERENO" },
				{ color: "#DF73FF", label: "CAPITO" },
				{ color: "#227BFF", label: "STANCO" },
				{ color: "#222EFF", label: "TRISTE" },
				{ color: "#2A23A3", label: "SOLO" },
				{ color: "#001DEC", label: "PENSIEROSO" },
				{ color: "#49C51A", label: "AGITATO" },
				{ color: "#2D7121", label: "SPAVENTATO" },
				{ color: "#008000", label: "CONFUSO" },
				{ color: "#3C6232", label: "ARRABBIATO" }
			];

			let orderOfChoices = [];
			let choose = {};
			for (let i = 0; i < quadri.length; i++) choose[i] = ['#FFFFFF'];

			_.each(quadri,(v,k)=>{
				const newQud = $(`
					<div class="swiper-slide">
						<img src="./images/hearts/gallery_quad/${v}">
					</div>`);
				$('.swiper-wrapper').append(newQud);

				const newEmo = $(`<ul></ul>`);
				newQud.append(newEmo);

				_.each(emozioni, (vi, idx) => {
					newEmo.append(
						`<li style="--i:${idx}" quad="${k}" val="${vi.color}">${vi.label}</li>`
					);
				});
			});

			setTimeout(function(){
				$('#info').hide();
				$('#btn-audio-white').hide();

				const swiper = new Swiper('.swiper',{ 
					pagination: { el: ".swiper-pagination" }
				});

				$('.swiper li').click(function(){

					// suono click
					const clickEl = document.getElementById('clickAudio');
					if (clickEl) {
						clickEl.currentTime = 0;
						clickEl.play();
					}

					if(!choose[$(this).attr('quad')]) choose[$(this).attr('quad')] = [];

					if(choose[$(this).attr('quad')].indexOf($(this).attr('val')) >= 0){
						choose[$(this).attr('quad')].splice(choose[$(this).attr('quad')].indexOf($(this).attr('val')), 1);
						$(this).removeClass('active');
					} else {
						$(this).addClass('active');
						choose[$(this).attr('quad')].push($(this).attr('val'));
					}

					$('#choose span').html(JSON.stringify(choose));
				});

				$('#reset').click(function () {
					const currentIndex = swiper.activeIndex;
					$(`.swiper li[quad="${currentIndex}"]`).removeClass('active');
					choose[currentIndex] = ['#FFFFFF'];
					$('#choose span').html(JSON.stringify(choose));
				});

			},500);

			$('#openscene').click(function(){
				$('#first_step').hide();
				$('#info').show();
				$('#btn-audio-white').show();
				scene(choose,quadri);
			});
			</script>

			<script>
			window.addEventListener('load', () => {
				document.querySelectorAll('.swiper li').forEach(btn => {
					const color = btn.getAttribute('val');
					if (color) btn.style.backgroundColor = color;
				});
			});
			</script>

			<div class="button-controls">
				<div id="btn-audio-white">
					<button aria-label="mute" id="audio-toggle-button">
						<img src="./images/icons/audio_mute.svg" id="mute-icon" alt="Mute Icon">
						<img src="./images/icons/audio.svg" id="audio-icon" hidden alt="Audio Icon">
