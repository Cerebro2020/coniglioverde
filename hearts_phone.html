
<!DOCTYPE html>

  <link rel="stylesheet" href="css/hearts.css" />
  <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <header>
    <div id="logo">
      <a href="index.html"><img src="images/loghi/coniglio_verde_logo.png" alt="Logo" /></a>
    </div>
    <input id="menu-toggle" type="checkbox" />
    <label class="menu-button-container" for="menu-toggle">
      <div class="menu-button"></div>
    </label>
    <ul class="menu">
      <li><a href="index.html">HOME</a></li>
      <li><a href="data.html">DATA</a></li>
      <li><a href="hearts_pc.html">TRY AGAIN</a></li>
    </ul>
  </header>

  <section>
    <div id="first_step">
      <div class="swiper">
        <div class="swiper-wrapper"></div>
        <div class="swiper-pagination"></div>
      </div>
      <div class="button-choose">
        <button class="btn btn-secondary" id="openscene" type="button">RESULT</button>
      </div>
    </div>

    <canvas>
      <script type="importmap">
					{
						"imports": {
							"three": "./three_class/three.module.js"
						}
					}
				</script>
    </canvas>

    

    <div class="info_leyer">
      <div id="info">
        <p>
          WASD&nbsp;&nbsp;>&nbsp;&nbsp;Move &nbsp; &nbsp; SHIFT/SPACE&nbsp;&nbsp;>&nbsp;&nbsp;/Down<br />
          Mouse&nbsp;&nbsp;>&nbsp;&nbsp;Look &nbsp; &nbsp; &nbsp;ESC/Click&nbsp;&nbsp;>&nbsp;&nbsp;Out/In
        </p>
      </div>
    </div>
    <!-- <div class="button-controls">
      <div id="btn-camera"><button>CAMERA</button></div>
      <div id="btn-audio"><button>AUDIO</button></div>
    </div> -->
  </section>

<script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>
<script>
$(document).ready(function () {
  let choose = {};
const quadri = [
  "01.jpg", "02.jpg", "03.jpg", "04.jpg", "05.jpg",
  "06.jpg", "07.jpg", "08.jpg", "09.jpg", "10.jpg",
  "11.jpg", "12.jpg", "13.jpg", "14.jpg", "15.jpg",
  "16.jpg", "17.jpg", "18.jpg", "19.jpg", "20.jpg"
];

  const emozioni = [
    { color: "#DEC414", label: "Interest" },
    { color: "#FEF600", label: "Fun" },
    { color: "#FEBE00", label: "Pride" },
    { color: "#FFD700", label: "Joy" },
    { color: "#C9A021", label: "Pleasure" },
    { color: "#FE005B", label: "Satisfaction" },
    { color: "#FF0000", label: "Love" },
    { color: "#A32590", label: "Admiration" },
    { color: "#FB46FF", label: "Relief" },
    { color: "#DF73FF", label: "Compassion" },
    { color: "#227BFF", label: "Sadness" },
    { color: "#3E39FF", label: "Guilt" },
    { color: "#222EFF", label: "Regret" },
    { color: "#001DEC", label: "Shame" },
    { color: "#2A23A3", label: "Frustration" },
    { color: "#49C51A", label: "Fear" },
    { color: "#2D7121", label: "Disguste" },
    { color: "#3C6232", label: "Contempt" },
    { color: "#0A5C0A", label: "Hate" },
    { color: "#008000", label: "Anger" }
  ];

  $.each(quadri, function (k, v) {
    const slide = $(`
      <div class="swiper-slide">
        <div class="emotion-slide">
          <div class="artwork">
            <img src="./images/hearts/gallery_quad/${v}" alt="Opera ${k + 1}">
          </div>
          <div class="emotion-wheel" id="wheel-${k}"></div>
        </div>
      </div>
    `);

    $(".swiper-wrapper").append(slide);

    const wheel = $(`#wheel-${k}`);
    // const raggio = 202;
    const raggio = window.innerWidth <= 724 ? 132 : 200;

    emozioni.forEach((emo, i) => {
      const angle = (i / emozioni.length) * 2 * Math.PI;
      const x = Math.cos(angle) * raggio;
      const y = Math.sin(angle) * raggio;

      const btn = $(`
        <div class="emotion-btn" title="${emo.label}">
          <svg xmlns="http://www.w3.org/2000/svg" fill="${emo.color}" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314"/>
          </svg>
          <span class="emotion-label">${emo.label}</span>
        </div>
      `);

      btn.css({
        position: "absolute",
        left: `calc(50% + ${x}px - 35px)`,
        top: `calc(50% + ${y}px - 35px)`
      });

      btn.on('click', function () {
  if (!choose[k]) choose[k] = [];

  const val = emo.color;
  const alreadySelected = $(this).hasClass('selected');

  if (alreadySelected) {
    choose[k] = choose[k].filter(c => c !== val);
    $(this).removeClass('selected');
  } else {
    if (choose[k].length >= 3) return;
    choose[k].push(val);
    $(this).addClass('selected');
  }
});


      wheel.append(btn);
    });
  });

  new Swiper('.swiper', {
    loop: false,
    pagination: {
      el: ".swiper-pagination",
    }
  });

  $('#openscene').click(() => {
  $('#first_step').hide();
  $('#info').show();
  $('#btn-camera, #btn-audio').show();

  
    for (let i = 0; i < quadri.length; i++) {
      if (!choose[i]) {
        choose[i] = ['#FFFFFF'];
      }
    }

    import('./hearts_phone.js').then(({ default: scene }) => {
      scene(choose, quadri);
    });
  });
});
</script>

</body>
</html>
