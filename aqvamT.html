            <script>
document.addEventListener("DOMContentLoaded", () => {
  const playBtn  = document.querySelector('#btn-play button');
  const pauseBtn = document.querySelector('#btn-pause button');

  const allButtons = document.querySelectorAll(
    '#btn-start button, #btn-play button, #btn-pause button, #btn-count button, #btn-quantity button, #btn-back button, #btn-cameraC button, #btn-cameraH button, #btn-hide-boxes1 button, #btn-hide-boxes2 button, #btn-hide-boxes3 button, #btn-jump-to-column button, #btn-previous-column button, #btn-audio-white button'
  );

  const multiActiveSelectors = [
    '#btn-count',
    '#btn-quantity',
    '#btn-hide-boxes1',
    '#btn-hide-boxes2',
    '#btn-hide-boxes3'
  ];

  const excludedSelectors = ['#btn-jump-to-column', '#btn-previous-column'];

  // ---- Gestione Play/Pause esclusiva ----
  function setPlayState(isPlaying) {
    playBtn.classList.toggle('active', isPlaying);
    pauseBtn.classList.toggle('active', !isPlaying);
  }

  playBtn.addEventListener('click',  () => setPlayState(true));
  pauseBtn.addEventListener('click', () => setPlayState(false));

  // ---- Gestione di tutti gli altri pulsanti ----
  allButtons.forEach(button => {
    button.addEventListener('click', () => {
      const parentId = '#' + button.parentElement.id;

      // Esclusi
      if (excludedSelectors.includes(parentId)) return;
      // Evita di interferire con play/pause
      if (parentId === '#btn-play' || parentId === '#btn-pause') return;

      const isMulti = multiActiveSelectors.includes(parentId);

      // Se non fa parte dei gruppi multipli → disattiva altri pulsanti singoli
      if (!isMulti) {
        allButtons.forEach(b => {
          const bParent = '#' + b.parentElement.id;
          if (
            !multiActiveSelectors.includes(bParent) &&
            !excludedSelectors.includes(bParent) &&
            bParent !== '#btn-play' &&
            bParent !== '#btn-pause'
          ) {
            b.classList.remove('active');
          }
        });
      }

      // Attiva/disattiva solo il pulsante cliccato
      button.classList.toggle('active');
    });
  });

  // ---- Stati iniziali ----
  setPlayState(true); // play attivo, pause spento
  document.querySelector('#btn-quantity button')?.classList.add('active'); // quantity attivo
  document.querySelector('#btn-count button')?.classList.remove('active'); // count disattivo
});
</script>
