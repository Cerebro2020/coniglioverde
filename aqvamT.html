        <script>
document.addEventListener("DOMContentLoaded", () => {

    // ---------------------------------------
    // DEFINIZIONE DELLE CATEGORIE DI PULSANTI
    // ---------------------------------------

    // Toggle (interruttori indipendenti)
    const toggleButtons = [
        '#btn-hide-boxes1',
        '#btn-hide-boxes2',
        '#btn-hide-boxes3',
        '#btn-count',
        '#btn-quantity',
        '#btn-calendar'
    ];

    // Radio (solo uno attivo)
    const radioButtons = [
        '#btn-play',
        '#btn-pause'
    ];

    // No-state (non devono mai avere .active)
    const noStateButtons = [
        '#btn-jump-to-column',
        '#btn-previous-column'
    ];

    // ---------------------------------------
    // FUNZIONE GENERALE PER OTTENERE IL <button>
    // ---------------------------------------
    function getButtonElement(selector) {
        const container = document.querySelector(selector);
        if (!container) return null;
        return container.querySelector("button");
    }

    // ---------------------------------------
    // TOGGLE BUTTONS (ON/OFF indipendenti)
    // ---------------------------------------
    toggleButtons.forEach(sel => {
        const div = document.querySelector(sel);
        const btn = getButtonElement(sel);
        if (!div || !btn) return;

        div.addEventListener("click", () => {
            btn.classList.toggle("active");
        });
    });

    // ---------------------------------------
    // RADIO BUTTONS (solo uno attivo)
    // ---------------------------------------
    radioButtons.forEach(sel => {
        const div = document.querySelector(sel);
        const btn = getButtonElement(sel);
        if (!div || !btn) return;

        div.addEventListener("click", () => {

            // disattiva gli altri
            radioButtons.forEach(otherSel => {
                const otherBtn = getButtonElement(otherSel);
                if (otherBtn) otherBtn.classList.remove("active");
            });

            // attiva questo
            btn.classList.add("active");
        });
    });

    // ---------------------------------------
    // NO-STATE BUTTONS (senza active)
    // ---------------------------------------
    noStateButtons.forEach(sel => {
        const div = document.querySelector(sel);
        if (!div) return;

        div.addEventListener("click", () => {
            // non mettiamo active
        });
    });

    // ---------------------------------------
    // STATI INIZIALI
    // ---------------------------------------

    // play deve essere attivo
    const playBtn = getButtonElement("#btn-play");
    if (playBtn) playBtn.classList.add("active");

    // pause deve essere spento
    const pauseBtn = getButtonElement("#btn-pause");
    if (pauseBtn) pauseBtn.classList.remove("active");

    // COUNT deve partire spento (torus2 invisibili)
const countBtn = getButtonElement("#btn-count");
if (countBtn) countBtn.classList.remove("active");

});
</script>
